name: site-check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://canastra-familia-bona.faldik2033.workers.dev
          for u in / /bobri/ /bobri/engine.js?v=1 /bobri/bot.js?v=1 /bobri/app.js?v=1 /bobri/style.css?v=1 /sw.js /sitemap.xml; do
            curl -s -o /dev/null -w "$u %{http_code} %{content_type} %{size_download}B\n" --max-time 25 "$B$u" || echo "$u FAIL"
          done
          curl -s --max-time 20 $B/bobri/ | grep -o "<title>[^<]*</title>"
          curl -s --max-time 20 $B/sw.js | grep -c bobri
