      <section id="oppSeat" class="seat-top" aria-label="Soupeř"></section>
      <section id="oppMelds" class="zone opp"></section>

      <section id="myMelds" class="zone mine"></section>

    <div id="hand"></div>
  </section>
  <footer id="actions"></footer>
  <div id="fx" aria-hidden="true"></div>
  <button id="chatBtn" data-act="chatopen" hidden></button>
  <section id="chat" hidden aria-live="polite"></section>
  <div id="toast" role="status"></div>
  <div id="overlay"></div>
  <div id="invite" role="alertdialog" hidden></div>
